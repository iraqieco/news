<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأخبار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#064e3b',
                        accent: '#047857'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-primary text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold"><i class="fa-solid fa-globe ml-2"></i>الشبكة الإخبارية</h1>
            <div id="auth-section">
                <button onclick="toggleAuthModal()" class="bg-white text-primary px-4 py-2 rounded-lg font-semibold hover:bg-gray-100 transition">
                    <i class="fa-solid fa-user-lock ml-1"></i> تسجيل الدخول / لوحة التحكم
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 space-y-12">
        <section>
            <div class="flex justify-between items-center border-b-2 border-primary pb-2 mb-6">
                <h2 class="text-xl font-bold text-primary"><i class="fa-solid fa-location-dot ml-2"></i>أخبار محلية</h2>
            </div>
            <div id="local-featured" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6"></div>
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                <h3 class="text-sm font-bold text-gray-500 mb-3">أرشيف الأخبار المحلية</h3>
                <ul id="local-archive" class="space-y-2 text-sm"></ul>
            </div>
        </section>

        <section>
            <div class="flex justify-between items-center border-b-2 border-primary pb-2 mb-6">
                <h2 class="text-xl font-bold text-primary"><i class="fa-solid fa-earth-americas ml-2"></i>أخبار عالمية</h2>
            </div>
            <div id="global-featured" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6"></div>
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                <h3 class="text-sm font-bold text-gray-500 mb-3">أرشيف الأخبار العالمية</h3>
                <ul id="global-archive" class="space-y-2 text-sm"></ul>
            </div>
        </section>
    </main>

    <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white w-full max-w-2xl rounded-xl shadow-lg p-6 overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-primary">لوحة التحكم والإدارة</h3>
                <button onclick="toggleAuthModal()" class="text-gray-500 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div id="login-form" class="space-y-4">
                <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-2 border rounded">
                <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-2 border rounded">
                <button onclick="login()" class="w-full bg-primary text-white py-2 rounded font-bold">دخول</button>
            </div>

            <div id="dashboard-content" class="hidden space-y-4">
                <form id="news-form" onsubmit="saveNews(event)" class="space-y-3 bg-gray-50 p-4 rounded border">
                    <input type="hidden" id="news-id">
                    <input type="text" id="news-title" placeholder="العنوان" required class="w-full p-2 border rounded">
                    <textarea id="news-desc" placeholder="الشرح والتفاصيل" required class="w-full p-2 border rounded"></textarea>
                    <input type="url" id="news-image" placeholder="رابط الصورة المباشر" required class="w-full p-2 border rounded">
                    <input type="url" id="news-source" placeholder="رابط المصدر (اختياري)" class="w-full p-2 border rounded">
                    <select id="news-category" class="w-full p-2 border rounded">
                        <option value="local">محلية</option>
                        <option value="global">عالمية</option>
                    </select>
                    <button type="submit" class="w-full bg-primary text-white py-2 rounded font-bold">حفظ الخبر</button>
                </form>

                <h4 class="font-bold mt-6 mb-2">إدارة الأخبار الحالية</h4>
                <div id="admin-news-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
                <button onclick="logout()" class="w-full bg-red-600 text-white py-2 rounded mt-4">تسجيل الخروج</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
